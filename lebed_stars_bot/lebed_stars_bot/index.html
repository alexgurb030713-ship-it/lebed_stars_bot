<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEBED stars</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f0f13; color: white; margin: 0; padding: 15px; text-align: center; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1c1c24; padding: 10px 15px; border-radius: 12px; margin-bottom: 20px; }
        .card { background: #252533; padding: 18px; border-radius: 14px; margin-bottom: 12px; cursor: pointer; text-align: left; transition: transform 0.1s; }
        .card:active { transform: scale(0.98); }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .card-desc { font-size: 13px; color: #a0a0ab; }
        .container { background: #1c1c24; border-radius: 14px; padding: 15px; margin-top: 20px; text-align: left; }
        .item-row, .top-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2d2d3d; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <span>⭐ Баланс: <span id="balance">0</span></span>
        <span>🏆 Всего звезд: <span id="stars">0</span></span>
    </div>

    <div class="card" onclick="openFreeCase()">
        <div class="card-title">🎁 Открыть кейс</div>
        <div class="card-desc">Получите случайный приз и звезды</div>
    </div>

    <div class="container">
        <h3 style="margin-top:0; text-align:center;">🎒 Ваш инвентарь</h3>
        <div id="inventory-list">Пусто...</div>
    </div>

    <div class="container">
        <h3 style="margin-top:0; text-align:center;">🏆 Топ игроков по звёздам</h3>
        <div id="top-container">Загрузка...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || 12345;
        const API_URL = "";

        async function loadData() {
            const res = await fetch(`${API_URL}/get_user`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ user_id: userId })
            });
            const data = await res.json();
            document.getElementById("balance").innerText = data.balance_stars;
            document.getElementById("stars").innerText = data.stars;
            loadInventory();
            loadTop();
        }

        async function openFreeCase() {
            const res = await fetch(`${API_URL}/open_case`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ user_id: userId })
            });
            const data = await res.json();
            alert(`🎉 Вам выпало: ${data.item} (+${data.reward} ⭐)`);
            loadData();
        }

        async function loadInventory() {
            const res = await fetch(`${API_URL}/inventory`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ user_id: userId })
            });
            const items = await res.json();
            const invList = document.getElementById("inventory-list");
            if (items.length === 0) {
                invList.innerHTML = "Инвентарь пуст";
                return;
            }
            invList.innerHTML = "";
            items.forEach(item => {
                invList.innerHTML += `
                    <div class="item-row">
                        <span>${item.item_name}</span>
                        <span><b>+${item.reward_stars}</b> ⭐</span>
                    </div>`;
            });
        }

        async function loadTop() {
            const res = await fetch(`${API_URL}/top`);
            const topData = await res.json();
            const container = document.getElementById("top-container");
            container.innerHTML = "";
            topData.forEach((player, index) => {
                container.innerHTML += `
                    <div class="top-item">
                        <span>#${index + 1} ID: ${player.user_id}</span>
                        <span><b>${player.stars}</b> ⭐</span>
                    </div>`;
            });
        }

        loadData();
    </script>
</body>
</html>
