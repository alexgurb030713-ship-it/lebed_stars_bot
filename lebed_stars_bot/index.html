<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEBED stars</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .balance {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }
        .nav-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: var(--tg-theme-button-color, #3b82f6);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-btn.secondary {
            background: rgba(255, 255, 255, 0.15);
        }
        .screen {
            width: 100%;
            max-width: 400px;
            display: none;
            flex-direction: column;
            gap: 15px;
        }
        .screen.active {
            display: flex;
        }
        .case-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .case-card h3 {
            margin: 0 0 10px 0;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #10b981;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .inventory-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #result-modal {
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            text-align: center;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>⭐ LEBED stars</h2>
        <div class="balance" id="user-balance">Баланс: загрузка... ⭐</div>
    </div>

    <!-- Навигация по экранам -->
    <div class="nav-buttons">
        <button class="nav-btn" onclick="switchScreen('cases')">📦 Кейсы</button>
        <button class="nav-btn secondary" onclick="switchScreen('inventory')">🎒 Инвентарь</button>
    </div>

    <!-- Экран кейсов -->
    <div id="cases-screen" class="screen active">
        <div class="case-card">
            <h3>🎁 Бесплатный кейс</h3>
            <p>Шанс на 10⭐, 25⭐, Мишку, Подарок, Розу и Сердце</p>
            <button class="action-btn" onclick="openCase('case_1')">Открыть бесплатно</button>
        </div>

        <div class="case-card">
            <h3>🚀 Кейс за 100 ⭐</h3>
            <p>Шанс на 50⭐, 75⭐, Ракету, Кольцо, Кубок и Алмаз</p>
            <button class="action-btn" onclick="openCase('case_2')">Открыть за 100 ⭐</button>
        </div>

        <div class="case-card">
            <h3>💎 Кейс за 500 ⭐</h3>
            <p>Шанс на 250⭐, 400⭐, Мороженое, Статую, Снуп Догга</p>
            <button class="action-btn" onclick="openCase('case_3')">Открыть за 500 ⭐</button>
        </div>

        <div id="result-modal"></div>
    </div>

    <!-- Экран инвентаря -->
    <div id="inventory-screen" class="screen">
        <h3>Ваши уникальные предметы</h3>
        <div id="inventory-list">
            <p style="text-align: center; opacity: 0.6;">Загрузка инвентаря...</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Получаем user_id из Telegram, для тестов в браузере ставим ID 1
        const userId = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 1;

        async function loadUserData() {
            try {
                const response = await fetch('/get_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await response.json();
                document.getElementById('user-balance').innerText = `Баланс: ${data.stars} ⭐`;
            } catch (e) {
                console.error("Ошибка загрузки пользователя", e);
            }
        }

        async function openCase(caseId) {
            const modal = document.getElementById('result-modal');
            modal.style.display = 'block';
            modal.innerText = 'Открываем кейс... 🎲';

            try {
                const response = await fetch('/open_case', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, case_id: caseId })
                });
                const data = await response.json();

                if (data.error) {
                    modal.innerText = `❌ ${data.error}`;
                } else {
                    modal.innerText = `🎉 ${data.msg}`;
                    loadUserData(); // обновляем баланс на экране
                }
            } catch (e) {
                modal.innerText = '❌ Ошибка соединения с сервером';
            }
        }

        async function loadInventory() {
            const listDiv = document.getElementById('inventory-list');
            listDiv.innerHTML = '<p style="text-align: center; opacity: 0.6;">Загрузка...</p>';

            try {
                const response = await fetch('/inventory', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });
                const items = await response.json();

                if (items.length === 0) {
                    listDiv.innerHTML = '<p style="text-align: center; opacity: 0.6;">Инвентарь пока пуст. Откройте кейсы!</p>';
                    return;
                }

                listDiv.innerHTML = '';
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'inventory-item';
                    div.innerHTML = `<span>🎁 ${item}</span>`;
                    listDiv.appendChild(div);
                });
            } catch (e) {
                listDiv.innerHTML = '<p style="text-align: center; color: red;">Не удалось загрузить инвентарь</p>';
            }
        }

        function switchScreen(screenName) {
            document.getElementById('cases-screen').classList.remove('active');
            document.getElementById('inventory-screen').classList.remove('active');

            if (screenName === 'cases') {
                document.getElementById('cases-screen').classList.add('active');
            } else if (screenName === 'inventory') {
                document.getElementById('inventory-screen').classList.add('active');
                loadInventory();
            }
        }

        // Первичная загрузка баланса при открытии мини-приложения
        loadUserData();
    </script>
</body>
</html>
