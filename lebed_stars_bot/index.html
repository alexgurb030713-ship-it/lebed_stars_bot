<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEBED stars</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .balance {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
        }
        .nav-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: var(--tg-theme-button-color, #3b82f6);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-btn.secondary {
            background: rgba(255, 255, 255, 0.15);
        }
        .screen {
            width: 100%;
            max-width: 400px;
            display: none;
            flex-direction: column;
            gap: 15px;
        }
        .screen.active {
            display: flex;
        }

        /* --- Стили рулетки CS:GO --- */
        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 110px;
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            margin-bottom: 10px;
        }
        /* Указатель по центру */
        .roulette-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: #f43f5e;
            z-index: 10;
            box-shadow: 0 0 10px #f43f5e;
        }
        .roulette-pointer::before {
            content: '';
            position: absolute;
            top: 0;
            left: -6px;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid #f43f5e;
        }
        /* Лента рулетки */
        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 10px;
            height: 90px;
            transition: transform 5s cubic-bezier(0.15, 0.85, 0.35, 1.2);
            will-change: transform;
        }
        .roulette-card {
            min-width: 80px;
            max-width: 80px;
            height: 80px;
            margin: 0 5px;
            background: #334155;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            padding: 5px;
        }
        /* ----------------------- */

        .case-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
        }
        .case-card h3 {
            margin: 0 0 5px 0;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #10b981;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .action-btn:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        .inventory-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #result-modal {
            padding: 12px;
            border-radius: 12px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            text-align: center;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>⭐ LEBED stars</h2>
        <div class="balance" id="user-balance">Баланс: загрузка... ⭐</div>
    </div>

    <div class="nav-buttons">
        <button class="nav-btn" onclick="switchScreen('cases')">📦 Кейсы</button>
        <button class="nav-btn secondary" onclick="switchScreen('inventory')">🎒 Инвентарь</button>
        <button class="nav-btn secondary" onclick="switchScreen('leaderboard')">🏆 Топ</button>
    </div>

    <!-- Экран кейсов с рулеткой -->
    <div id="cases-screen" class="screen active">
        
        <!-- Окно рулетки -->
        <div class="roulette-wrapper">
            <div class="roulette-pointer"></div>
            <div class="roulette-track" id="roulette-track"></div>
        </div>

        <div id="result-modal"></div>

        <div class="case-card">
            <h3>🎁 Бесплатный кейс</h3>
            <button class="action-btn" id="btn-case1" onclick="openCase('case_1')">Открыть бесплатно</button>
        </div>

        <div class="case-card">
            <h3>🚀 Кейс за 100 ⭐</h3>
            <button class="action-btn" id="btn-case2" onclick="openCase('case_2')">Открыть за 100 ⭐</button>
        </div>

        <div class="case-card">
            <h3>💎 Кейс за 500 ⭐</h3>
            <button class="action-btn" id="btn-case3" onclick="openCase('case_3')">Открыть за 500 ⭐</button>
        </div>
    </div>

    <!-- Экран инвентаря -->
    <div id="inventory-screen" class="screen">
        <h3>Ваши уникальные предметы</h3>
        <div id="inventory-list"></div>
    </div>

    <!-- Экран топа -->
    <div id="leaderboard-screen" class="screen">
        <h3>🏆 Топ игроков по звёздам</h3>
        <div id="leaderboard-list"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 1;
        let isSpinning = false;

        // Популярные предметы для наполнения ленты
        const ALL_ITEMS = [
            "1 ⭐", "2 ⭐", "🧸 Мишка", "🎁 Подарок", "🌹 Роза", "❤️ Сердце",
            "50 ⭐", "75 ⭐", "🚀 Ракета", "💍 Кольцо", "🏆 Кубок", "💎 Алмаз",
            "250 ⭐", "400 ⭐", "🍦 Мороженое", "🗽 Статуя", "🕶️ Снуп Догг", "🎅 Шапка"
        ];

        // Заполнение рулетки случайными элементами по умолчанию
        function initRoulette() {
            const track = document.getElementById('roulette-track');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            track.innerHTML = '';
            for (let i = 0; i < 60; i++) {
                const item = ALL_ITEMS[Math.floor(Math.random() * ALL_ITEMS.length)];
                const card = document.createElement('div');
                card.className = 'roulette-card';
                card.innerText = item;
                track.appendChild(card);
            }
        }

        async function loadUserData() {
            try {
                const response = await fetch('/get_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await response.json();
                document.getElementById('user-balance').innerText = `Баланс: ${data.stars} ⭐`;
            } catch (e) { console.error(e); }
        }

        async function openCase(caseId) {
            if (isSpinning) return;
            
            const modal = document.getElementById('result-modal');
            modal.style.display = 'none';
            
            setButtonsDisabled(true);

            try {
                const response = await fetch('/open_case', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, case_id: caseId })
                });
                const data = await response.json();

                if (data.error) {
                    modal.style.display = 'block';
                    modal.innerText = `❌ ${data.error}`;
                    setButtonsDisabled(false);
                    return;
                }

                // ВЫПАВШИЙ ДРОП
                const winningText = data.type === 'stars' ? `${data.amount} ⭐` : data.name;

                // Запускаем анимацию прокрутки рулетки
                spinRoulette(winningText, data.msg);

            } catch (e) {
                modal.style.display = 'block';
                modal.innerText = '❌ Ошибка соединения с сервером';
                setButtonsDisabled(false);
            }
        }

        function spinRoulette(winningText, msg) {
            isSpinning = true;
            const track = document.getElementById('roulette-track');
            
            // Пересоздаем ленту для анимации
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            track.innerHTML = '';

            const WIN_INDEX = 45; // Победный элемент ставим на 45-е место

            for (let i = 0; i < 60; i++) {
                const card = document.createElement('div');
                card.className = 'roulette-card';
                
                if (i === WIN_INDEX) {
                    card.innerText = winningText;
                    card.style.border = "2px solid #f43f5e";
                    card.style.background = "#475569";
                } else {
                    card.innerText = ALL_ITEMS[Math.floor(Math.random() * ALL_ITEMS.length)];
                }
                track.appendChild(card);
            }

            // Ширина карточки (80px) + margin-left/right (10px) = 90px
            const cardWidth = 90; 
            const wrapperWidth = document.querySelector('.roulette-wrapper').offsetWidth;
            
            // Расчет позиции так, чтобы 45-й элемент встал ровно под ролик
            const targetOffset = (WIN_INDEX * cardWidth) - (wrapperWidth / 2) + (cardWidth / 2);

            // Небольшой рандомное смещение внутри карточки для реалистичности
            const randomShift = Math.floor(Math.random() * 30) - 15;

            setTimeout(() => {
                track.style.transition = 'transform 5s cubic-bezier(0.15, 0.85, 0.35, 1.2)';
                track.style.transform = `translateX(-${targetOffset + randomShift}px)`;
            }, 50);

            // После завершения рулетки (5 секунд) показываем сообщение
            setTimeout(() => {
                const modal = document.getElementById('result-modal');
                modal.style.display = 'block';
                modal.innerText = `🎉 ${msg}`;
                
                loadUserData();
                setButtonsDisabled(false);
                isSpinning = false;
            }, 5200);
        }

        function setButtonsDisabled(disabled) {
            document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = disabled);
        }

        async function loadInventory() {
            const listDiv = document.getElementById('inventory-list');
            listDiv.innerHTML = '<p style="text-align: center; opacity: 0.6;">Загрузка...</p>';
            try {
                const response = await fetch('/inventory', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });
                const items = await response.json();
                if (items.length === 0) {
                    listDiv.innerHTML = '<p style="text-align: center; opacity: 0.6;">Инвентарь пока пуст.</p>';
                    return;
                }
                listDiv.innerHTML = '';
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'inventory-item';
                    div.innerHTML = `<span>🎁 ${item}</span>`;
                    listDiv.appendChild(div);
                });
            } catch (e) {
                listDiv.innerHTML = '<p style="text-align: center; color: red;">Ошибка загрузки</p>';
            }
        }

        async function loadLeaderboard() {
            const listDiv = document.getElementById('leaderboard-list');
            listDiv.innerHTML = '<p style="text-align: center; opacity: 0.6;">Загрузка...</p>';
            try {
                const response = await fetch('/top');
                const players = await response.json();
                listDiv.innerHTML = '';
                players.forEach((player, index) => {
                    const div = document.createElement('div');
                    div.className = 'inventory-item';
                    let medal = `#${index + 1}`;
                    if (index === 0) medal = '🥇';
                    if (index === 1) medal = '🥈';
                    if (index === 2) medal = '🥉';
                    div.innerHTML = `<span>${medal} ID: ${player.user_id}</span><strong>${player.stars} ⭐</strong>`;
                    listDiv.appendChild(div);
                });
            } catch (e) {
                listDiv.innerHTML = '<p style="text-align: center; color: red;">Ошибка загрузки</p>';
            }
        }

        function switchScreen(screenName) {
            document.getElementById('cases-screen').classList.remove('active');
            document.getElementById('inventory-screen').classList.remove('active');
            document.getElementById('leaderboard-screen').classList.remove('active');

            if (screenName === 'cases') {
                document.getElementById('cases-screen').classList.add('active');
            } else if (screenName === 'inventory') {
                document.getElementById('inventory-screen').classList.add('active');
                loadInventory();
            } else if (screenName === 'leaderboard') {
                document.getElementById('leaderboard-screen').classList.add('active');
                loadLeaderboard();
            }
        }

        initRoulette();
        loadUserData();
    </script>
</body>
</html>
